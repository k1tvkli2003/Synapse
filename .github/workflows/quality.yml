name: Quality

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Flutter workspace and Web evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DART_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Disable tool telemetry
        run: |
          flutter config --no-analytics
          dart --disable-analytics

      - name: Resolve the committed dependency graph
        run: flutter pub get --enforce-lockfile

      - name: Reject lockfile mutation
        run: git diff --exit-code -- pubspec.lock

      - name: Run the complete product gate
        run: dart run melos run verify

      - name: Package public Web build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synapse-web-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/app/build/web
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Package verification receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synapse-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            contracts/architecture/architecture-verification.v1.json
            contracts/actions/actions-verification.v1.json
            contracts/generated/generated-verification.v1.json
            contracts/generated/web-runtime-assets.v1.json
            contracts/performance/performance-verification.v1.json
            contracts/preservation/preservation-verification.v1.json
            contracts/product/capability-completion-verification.v1.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
