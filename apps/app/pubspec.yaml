name: synapse_app
description: >
  Synapse — a unified cross-platform medical super-app. One Flutter codebase for
  Android, iOS, macOS, Windows, Linux and Web.
publish_to: 'none'
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + DI (prompt 08) and routing (prompt 31).
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  equatable: ^2.0.5
  crypto: ^3.0.7
  cryptography: ^2.9.0
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter_secure_storage: ^10.3.1
  idb_shim: ^2.9.6+2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.4.7
  qr_flutter: ^4.1.0

  # Synapse workspace packages.
  synapse_core:
    path: ../../packages/core
  synapse_ui:
    path: ../../packages/ui
  synapse_engines:
    path: ../../packages/engines
  synapse_services:
    path: ../../packages/services
  synapse_config:
    path: ../../packages/config
  synapse_foundation:
    path: ../../packages/foundation
  synapse_motion:
    path: ../../packages/motion
  synapse_observability:
    path: ../../packages/observability
  supabase_flutter: ^2.15.4

dev_dependencies:
  drift: 2.34.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/identity/luma_facefront/
    - assets/identity/wordmark/
