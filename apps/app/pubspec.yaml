name: synapse_app
description: >
  Synapse — a unified cross-platform medical super-app. One Flutter codebase for
  Android, iOS, macOS, Windows, Linux and Web.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + DI (prompt 08) and routing (prompt 31).
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3

  # Synapse workspace packages.
  synapse_core:
    path: ../../packages/core
  synapse_ui:
    path: ../../packages/ui
  synapse_engines:
    path: ../../packages/engines
  synapse_services:
    path: ../../packages/services
  synapse_config:
    path: ../../packages/config

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
