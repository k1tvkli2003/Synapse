name: synapse_services
description: >
  Offline-first repositories + seed data for Synapse. The app boots on these
  local repositories with no backend credentials; a Supabase-backed
  implementation can be swapped in behind the same interfaces.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  synapse_core:
    path: ../core
  synapse_engines:
    path: ../engines
  synapse_foundation:
    path: ../foundation
  crypto: ^3.0.7
  cryptography: ^2.9.0
  drift: ^2.34.2
  http: ^1.5.0
  meta: ^1.19.0

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: 2.34.0
  flutter_lints: ^6.0.0
  test: ^1.25.0
