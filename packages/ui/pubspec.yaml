name: synapse_ui
description: >
  The Synapse design system — tokens (ThemeExtension), theming, responsive
  primitives and the shared widget library every module is built from.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  synapse_core:
    path: ../core
  synapse_motion:
    path: ../motion
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
