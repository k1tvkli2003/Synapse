  primitives and the shared widget library every module is built from.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  synapse_core:
    path: ../core
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_lints: ^4.0.0
