name: synapse_engines
description: >
  Pure-Dart shared engines: gamification (XP/streak/league/quests/achievements),
  the SRS scheduler, the deterministic lab rule engine and the ECG signal
  generator. No Flutter dependency — fully unit-testable.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  synapse_core:
    path: ../core
  meta: ^1.19.0

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.0
